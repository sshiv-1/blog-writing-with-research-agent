services:
  - type: web
    name: blog-agent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false       # set manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false       # set manually in Render dashboard
      - key: TAVILY_API_KEY
        sync: false       # set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
